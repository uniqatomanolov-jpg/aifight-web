<svg viewBox="0 0 44 40" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  
  <defs>
    <linearGradient id="cy" x1="0" y1="4" x2="26" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7FFBFF"/>
      <stop offset="55%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088B3"/>
    </linearGradient>
    <linearGradient id="or" x1="14" y1="4" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="50%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#E03A00"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- Halos, behind the blades -->
  <path d="M17 4 L4 36 L10 36 L19 14 Z" fill="#00E5FF" opacity="0.5" filter="url(#soft)"/>
  <path d="M24 4 L37 4 L33 11 L26 11 Z" fill="#FF7A18" opacity="0.5" filter="url(#soft)"/>

  <!-- Left blade: the A, angular and faceted like the reference -->
  <path d="M17.5 3 L23.5 3 L23.5 37 L17 37 L19.5 30 L11.5 30 L8.5 37 L2 37 Z"
        fill="url(#cy)"/>
  <path d="M17.5 3 L20.5 3 L20.5 37 L17 37 L19.5 30 L15 30 Z" fill="#BFFAFF" opacity="0.35"/>
  <path d="M17.2 14 L20.2 21.5 L14 21.5 Z" fill="#0A0B0F"/>

  <!-- Right blade: the F, mirrored so the two forms collide at the core -->
  <path d="M24.5 3 L41 3 L37 10 L30.5 10 L30.5 16 L38.5 16 L35 22.5 L30.5 22.5 L30.5 37 L24.5 37 Z"
        fill="url(#or)"/>
  <path d="M24.5 3 L27.5 3 L27.5 37 L24.5 37 Z" fill="#FFD9A8" opacity="0.3"/>

  <!-- Collision core -->
  <circle cx="24" cy="19" r="7" fill="url(#core)" opacity="0.9"/>
  <path d="M24 10 L25.4 17.6 L33 19 L25.4 20.4 L24 28 L22.6 20.4 L15 19 L22.6 17.6 Z"
        fill="#FFFFFF" opacity="0.95"/>

</svg>
